name: CI — Targeting Service

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/targeting-service-main/**'
      - 'k8s/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'services/targeting-service-main/**'
      - 'k8s/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

jobs:
  call:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      service: 'targeting'
      context: 'services/targeting-service-main'
      dockerfile: 'Dockerfile'
      image_name: 'targeting-service'
      language: 'python'
      push: ${{ github.ref == 'refs/heads/main' }}
      tests_command: 'python -m pytest test_app.py -v --tb=short'
    secrets:
      ecr_repo_prefix: ${{ secrets.ECR_REPOSITORY_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
