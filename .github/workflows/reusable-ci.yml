name: Reusable CI

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION: #us-east-1
        required: true
      K8S_REPO_TOKEN:
        required: true
    inputs:
      service:
        required: true
        type: string
      context:
        required: false
        type: string
        default: ''
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      image_name:
        required: false
        type: string
        default: ''
      language:
        required: false
        type: string
        default: 'go'
      push:
        required: false
        type: boolean
        default: false
      ecr_registry:
        required: false
        type: string
        default: ''
      tests_command:
        required: false
        type: string
        default: ''
      # Set to true in the caller workflow after the Kubernetes repository is ready.
      update_k8s_manifest:
        required: true
        type: boolean
        default: false
      # Replace with the manifest path relative to the root of the Kubernetes repository.
      k8s_manifest_path:
        required: true
        type: string
        default: 'path/to/deployment.yaml'
      # Replace with the external repository in owner/repository format.
      k8s_repository:
        required: false
        type: string
        default: 'castilhoarth/tech-challenge-3-k8s'
      # Replace if the Kubernetes manifest is maintained on a branch other than main.
      k8s_branch:
        required: false
        type: string
        default: 'main'
      # Replace with the current container name in .spec.template.spec.containers.
      k8s_container_name:
        required: false
        type: string
        default: 'your-container-name'
      # Replace with the image repository prefix used in the Kubernetes manifest.
      # The generated SHA tag is appended by this workflow.
      k8s_image_prefix:
        required: false
        type: string
        default: ''
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
      image_tag: ${{ steps.set-image.outputs.image_tag }}
      context: ${{ steps.ctx.outputs.context }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine context
        id: ctx
        run: |
          if [ -z "${{ inputs.context }}" ]; then
            echo "context=services/${{ inputs.service }}-main" >> $GITHUB_OUTPUT
          else
            echo "context=${{ inputs.context }}" >> $GITHUB_OUTPUT
          fi

      - name: Set image name and tag
        id: set-image
        run: |
          SHORT=${GITHUB_SHA::7}
          TAG=sha-${SHORT}
          IMAGE_NAME="${{ inputs.image_name }}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${{ inputs.service }}-service"
          fi
          echo "image=${IMAGE_NAME}:${TAG}" >> $GITHUB_OUTPUT
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT

  deps_build_and_scan:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        if: ${{ inputs.language == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        if: ${{ inputs.language == 'go' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/.cache/gomod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      - name: Setup Python
        if: ${{ inputs.language == 'python' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        if: ${{ inputs.language == 'python' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install dev tools (Go)
        if: ${{ inputs.language == 'go' }}
        working-directory: ${{ needs.prepare.outputs.context }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go vet ./...

      - name: Install dev tools (Python)
        if: ${{ inputs.language == 'python' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit pytest

      - name: Run dependency security scan (Go)
        if: ${{ inputs.language == 'go' }}
        working-directory: ${{ needs.prepare.outputs.context }}
        run: gosec ./...

      - name: Run dependency security scan (Python)
        if: ${{ inputs.language == 'python' }}
        working-directory: ${{ needs.prepare.outputs.context }}
        run: pip-audit -r requirements.txt || true

      - name: Run tests (Go)
        if: ${{ inputs.language == 'go' && inputs.tests_command != '' }}
        working-directory: ${{ needs.prepare.outputs.context }}
        run: ${{ inputs.tests_command }}

      - name: Run tests (Python)
        if: ${{ inputs.language == 'python' && inputs.tests_command != '' }}
        working-directory: ${{ needs.prepare.outputs.context }}
        env:
          ENVIRONMENT: test
        run: |
          pip install -r requirements.txt
          ${{ inputs.tests_command }}

  docker_build:
    needs:
      - prepare
      - deps_build_and_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        env:
          CTX: ${{ needs.prepare.outputs.context }}
          IMG: ${{ needs.prepare.outputs.image }}
        run: |
          docker build -f "$CTX/${{ inputs.dockerfile }}" -t "$IMG" "$CTX"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$IMG" "${IMG%:*}:latest" || true
          fi

      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.prepare.outputs.image }}
          scan-type: image
          severity: CRITICAL,HIGH

      - name: Save image for downstream job
        if: ${{ inputs.push }}
        env:
          IMG: ${{ needs.prepare.outputs.image }}
        run: docker save "$IMG" -o /tmp/image.tar

      - name: Upload image artifact
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ inputs.service }}
          path: /tmp/image.tar
          retention-days: 1

  push_ecr:
    needs:
      - prepare
      - docker_build
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ inputs.service }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          ECR_REG: ${{ steps.ecr-login.outputs.registry }}
        run: |
          TAG="${{ needs.prepare.outputs.image_tag }}"
          REPO_NAME="${{ inputs.image_name }}"
          FULL="${ECR_REG}/${REPO_NAME}"
          docker tag "$IMAGE" "${FULL}:${TAG}"
          docker push "${FULL}:${TAG}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$IMAGE" "${FULL}:latest" || true
            docker push "${FULL}:latest"
          fi

  update_k8s_manifest:
    # Optional final pipeline step: changes the external manifest so Argo CD detects
    # a Git change and reconciles the application.
    needs:
      - prepare
      - push_ecr
    # Runs only when explicitly enabled, after a successful image push on main.
    if: ${{ inputs.update_k8s_manifest && inputs.push && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kubernetes repository
        # Replace the repository, branch, and token input values above when ready.
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.k8s_repository }}
          ref: ${{ inputs.k8s_branch }}
          token: ${{ secrets.K8S_REPO_TOKEN }}
          # Keep this separate from the application repository checkout.
          path: k8s-manifests

      - name: Install yq
        # yq edits the YAML manifest without requiring a checked-in script.
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image
        # Use the caller-provided image prefix and the same tag pushed to ECR.
        working-directory: k8s-manifests
        env:
          # Manifest path is relative to the checked-out Kubernetes repository.
          MANIFEST: ${{ inputs.k8s_manifest_path }}
          # Existing container name to find in the deployment manifest.
          CONTAINER_NAME: ${{ inputs.k8s_container_name }}
          IMAGE_PREFIX: ${{ inputs.k8s_image_prefix }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          yq -i '
            (.spec.template.spec.containers[] | select(.name == strenv(CONTAINER_NAME)).image)
              = (strenv(IMAGE_PREFIX) + ":" + strenv(IMAGE_TAG))
          ' "$MANIFEST"

      - name: Commit and push manifest change
        # A commit in the Kubernetes repository is the event Argo CD listens for.
        working-directory: k8s-manifests
        env:
          # Used to identify which service triggered the manifest update.
          SERVICE: ${{ inputs.service }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.k8s_manifest_path }}"
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(${SERVICE}): trigger Argo CD sync"
          git push origin "${{ inputs.k8s_branch }}"