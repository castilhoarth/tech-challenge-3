name: CI — Auth Service

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/auth-service-main/**'
      - 'k8s/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'services/auth-service-main/**'
      - 'k8s/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

jobs:
  call:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      service: 'auth'
      context: 'services/auth-service-main'
      dockerfile: 'Dockerfile'
      image_name: 'auth-service'
      language: 'go'
      push: ${{ github.ref == 'refs/heads/main' }}
      tests_command: ''
    secrets:
      ecr_registry: ${{ secrets.ECR_REGISTRY }}
      ecr_repo_prefix: ${{ secrets.ECR_REPOSITORY_PREFIX }}
